name: CI Checks

# Runs on every pull request (feature → development, and development → main)
# and is also invoked by the Integration and Release workflows
# (workflow_call), so the same gates always apply.

on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew assemble --no-daemon

      - name: Test (with JaCoCo)
        run: ./gradlew test --no-daemon -I .github/ci.init.gradle.kts

      - name: Coverage summary
        run: |
          awk -F',' 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
            printf "### Coverage\n" >> ENVIRON["GITHUB_STEP_SUMMARY"]
            printf "- Lines: **%.1f%%** (%d/%d)\n", lc/(lc+lm)*100, lc, lc+lm >> ENVIRON["GITHUB_STEP_SUMMARY"]
            printf "- Branches: **%.1f%%** (%d/%d)\n", (bc+bm)? bc/(bc+bm)*100 : 100, bc, bc+bm >> ENVIRON["GITHUB_STEP_SUMMARY"]
          }' build/reports/jacoco/test/jacocoTestReport.csv

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 30

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate dependency lockfile
        run: ./gradlew dependencies --write-locks --no-daemon -I .github/security.init.gradle.kts

      - name: Install Trivy
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz | tar -xz trivy
          sudo mv trivy /usr/local/bin/
          trivy version

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true
          ignore-unfixed: true
          exit-code: '1'
          output: 'trivy-results.txt'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.txt
          retention-days: 30

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep SAST
        run: pipx run semgrep scan --config p/java --error --metrics=off --output semgrep-results.txt

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.txt
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [build, trivy, semgrep]
    steps:
      - name: Workflow summary
        run: |
          {
            echo "### CI Checks results"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Build + Test | ${{ needs.build.result }} |"
            echo "| Trivy (SCA + secrets) | ${{ needs.trivy.result }} |"
            echo "| Semgrep (SAST) | ${{ needs.semgrep.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Emits one OTel span per job to Grafana Cloud (OTLP/HTTP). Skips silently
  # unless the GRAFANA_OTLP_ENDPOINT variable + GRAFANA_OTLP_AUTH secret are configured.
  tracing:
    runs-on: ubuntu-latest
    if: always()
    needs: [build, trivy, semgrep]
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
    steps:
      - name: Emit run telemetry (OTLP/HTTP)
        run: |
          if [ -z "$OTLP_ENDPOINT" ] || [ -z "$OTLP_AUTH" ]; then
            echo "GRAFANA_OTLP_* not configured — skipping tracing"
            exit 0
          fi
          NOW=$(date +%s%N)
          TRACE_ID=$(echo "${{ github.run_id }}${{ github.run_attempt }}${{ github.sha }}" | sha256sum | cut -c1-32)
          SPANS="[]"
          for job in build trivy semgrep; do
            result=$(echo "$JOB_RESULTS" | jq -r ".$job.result")
            status=2; { [ "$result" = "success" ] || [ "$result" = "skipped" ]; } && status=1
            span_id=$(echo "${{ github.run_id }}-$job" | md5sum | cut -c1-16)
            SPANS=$(echo "$SPANS" | jq --arg n "$job" --arg t "$TRACE_ID" --arg s "$span_id" \
              --arg st "$NOW" --arg r "$result" --argjson c "$status" \
              '. + [{traceId:$t,spanId:$s,name:$n,kind:1,startTimeUnixNano:$st,endTimeUnixNano:$st,attributes:[{key:"job.result",value:{stringValue:$r}}],status:{code:$c}}]')
          done
          jq -n --arg repo "${{ github.repository }}" --arg wf "${{ github.workflow }}" \
            --arg sha "${{ github.sha }}" --arg ref "${{ github.ref_name }}" \
            --arg run "${{ github.run_id }}" --arg actor "${{ github.actor }}" --argjson spans "$SPANS" \
            '{resourceSpans:[{resource:{attributes:[
              {key:"service.name",value:{stringValue:$repo}},
              {key:"ci.workflow",value:{stringValue:$wf}},
              {key:"ci.run_id",value:{stringValue:$run}},
              {key:"vcs.ref",value:{stringValue:$sha}},
              {key:"vcs.branch",value:{stringValue:$ref}},
              {key:"ci.actor",value:{stringValue:$actor}}]},
              scopeSpans:[{scope:{name:"github-actions"},spans:$spans}]}]}' \
            | curl -sf -X POST "$OTLP_ENDPOINT/v1/traces" \
                -H "Authorization: Basic $OTLP_AUTH" -H "Content-Type: application/json" -d @-
          echo "Telemetry emitted for run ${{ github.run_id }}"

# ---------------------------------------------------------------------------
# Not ported from the reference pipeline (see README "Not ported"):
# - Threat Modeling validation: enterprise-internal tool, no free equivalent.
# - SCQA: SonarCloud is free for public repos only — could be enabled later.
# - CodeQL: free for public repos only (this repo may be private).
# - Required status checks on protected branches: pending first CI run to pin
#   the exact check names.
# - Commit/ticket validation: commitlint (conventional commits) is free if a
#   commit convention is adopted.
# ---------------------------------------------------------------------------
