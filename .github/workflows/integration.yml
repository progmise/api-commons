name: Integration

# Runs on every merge to development or main. Executes the same checks as a
# PR; the merged commit is consumable as a development version via JitPack
# (com.github.<org>:<repo>:<commit-sha>).

on:
  push:
    branches:
      - main
      - development

jobs:
  ci:
    name: "01 CI Checks"
    uses: ./.github/workflows/ci.yml

  snapshot:
    name: "02 JitPack snapshot"
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot availability
        run: |
          {
            echo "### Development version"
            echo "This commit is resolvable via JitPack:"
            echo '```'
            echo "com.github.${{ github.repository_owner }}:${{ github.event.repository.name }}:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
