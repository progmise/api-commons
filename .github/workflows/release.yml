name: Release

# Thin caller — all logic lives in progmise/reusable-workflows (@v1).
# Manual release on main: bump `version` in build.gradle.kts, merge
# development → main, then run this workflow (Actions → Release → Run).

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release
    uses: progmise/reusable-workflows/.github/workflows/release.yml@v1
    secrets: inherit
