name: Release

# Manual release on main: development → PR → main, bump `version` in
# build.gradle.kts, then run this workflow. It validates the version, runs
# all CI checks, publishes to Maven Central and creates the tag + GH Release.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Require main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::The Release workflow must run on main" && exit 1
          fi

      - name: Validate version
        id: version
        run: |
          v=$(grep -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts)
          if [ -z "$v" ]; then
            echo "::error::Could not read version from build.gradle.kts" && exit 1
          fi
          if [[ "$v" == *SNAPSHOT* ]]; then
            echo "::error::Cannot release a SNAPSHOT version: $v" && exit 1
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$v$"; then
            echo "::error::Tag $v already exists — bump the version" && exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral --no-daemon -I .github/publish.init.gradle.kts

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true

  # Emits one OTel span per job to Grafana Cloud (OTLP/HTTP). Skips silently
  # unless GRAFANA_OTLP_ENDPOINT + GRAFANA_OTLP_AUTH secrets are configured.
  tracing:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, ci, publish, release]
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
    steps:
      - name: Emit run telemetry (OTLP/HTTP)
        run: |
          if [ -z "$OTLP_ENDPOINT" ] || [ -z "$OTLP_AUTH" ]; then
            echo "GRAFANA_OTLP_* secrets not configured — skipping tracing"
            exit 0
          fi
          NOW=$(date +%s%N)
          TRACE_ID=$(echo "${{ github.run_id }}${{ github.run_attempt }}${{ github.sha }}" | sha256sum | cut -c1-32)
          SPANS="[]"
          for job in validate ci publish release; do
            result=$(echo "$JOB_RESULTS" | jq -r ".$job.result")
            status=2; { [ "$result" = "success" ] || [ "$result" = "skipped" ]; } && status=1
            span_id=$(echo "${{ github.run_id }}-$job" | md5sum | cut -c1-16)
            SPANS=$(echo "$SPANS" | jq --arg n "$job" --arg t "$TRACE_ID" --arg s "$span_id" \
              --arg st "$NOW" --arg r "$result" --argjson c "$status" \
              '. + [{traceId:$t,spanId:$s,name:$n,kind:1,startTimeUnixNano:$st,endTimeUnixNano:$st,attributes:[{key:"job.result",value:{stringValue:$r}}],status:{code:$c}}]')
          done
          jq -n --arg repo "${{ github.repository }}" --arg wf "${{ github.workflow }}" \
            --arg sha "${{ github.sha }}" --arg ref "${{ github.ref_name }}" \
            --arg run "${{ github.run_id }}" --arg actor "${{ github.actor }}" --argjson spans "$SPANS" \
            '{resourceSpans:[{resource:{attributes:[
              {key:"service.name",value:{stringValue:$repo}},
              {key:"ci.workflow",value:{stringValue:$wf}},
              {key:"ci.run_id",value:{stringValue:$run}},
              {key:"vcs.ref",value:{stringValue:$sha}},
              {key:"vcs.branch",value:{stringValue:$ref}},
              {key:"ci.actor",value:{stringValue:$actor}}]},
              scopeSpans:[{scope:{name:"github-actions"},spans:$spans}]}]}' \
            | curl -sf -X POST "$OTLP_ENDPOINT/v1/traces" \
                -H "Authorization: Basic $OTLP_AUTH" -H "Content-Type: application/json" -d @-
          echo "Telemetry emitted for run ${{ github.run_id }}"
