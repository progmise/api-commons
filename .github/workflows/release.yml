name: Release

# Manual release: bump `version` in build.gradle.kts, merge to main, then run
# this workflow. It validates the version, runs all CI checks, publishes to
# Maven Central and creates the git tag + GitHub Release.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        id: version
        run: |
          v=$(grep -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts)
          if [ -z "$v" ]; then
            echo "::error::Could not read version from build.gradle.kts" && exit 1
          fi
          if [[ "$v" == *SNAPSHOT* ]]; then
            echo "::error::Cannot release a SNAPSHOT version: $v" && exit 1
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$v$"; then
            echo "::error::Tag $v already exists — bump the version" && exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral --no-daemon -I .github/publish.init.gradle.kts

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true
